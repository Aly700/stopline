[project]
name = "stopline"
version = "0.1.0"
description = "Stop a tree of agents mid-run and account for every action already started."
requires-python = ">=3.12"
dependencies = [
    "pymongo>=4.10",
    "certifi",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stopline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
