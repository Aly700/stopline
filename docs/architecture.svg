<path d="M 120 476 L 120 247 L 320 247" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#head)"/>
<circle cx="120" cy="360" r="11" fill="#232F3E" stroke="#FFFFFF" stroke-width="2"/><text x="120" y="364.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
<text x="138" y="364" text-anchor="start" font-size="12" font-weight="500" fill="#16191F" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">ask to act</text>
<path d="M 760 247 L 900 247" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#head)" marker-start="url(#tail)"/>
<circle cx="830" cy="247" r="11" fill="#232F3E" stroke="#FFFFFF" stroke-width="2"/><text x="830" y="251.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
<text x="830" y="226" text-anchor="middle" font-size="12" font-weight="500" fill="#16191F" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">one transaction</text>
<path d="M 244 476 L 244 339 L 320 339" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#head)"/>
<circle cx="244" cy="420" r="11" fill="#232F3E" stroke="#FFFFFF" stroke-width="2"/><text x="244" y="424.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
<text x="262" y="424" text-anchor="start" font-size="12" font-weight="500" fill="#16191F" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">claim, then send</text>
<path d="M 622 372 L 622 476" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#head)" marker-start="url(#tail)"/>
<circle cx="622" cy="412" r="11" fill="#232F3E" stroke="#FFFFFF" stroke-width="2"/><text x="622" y="416.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
<text x="640" y="416" text-anchor="start" font-size="12" font-weight="500" fill="#16191F" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">apply once</text>
<path d="M 760 339 L 900 339" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#head)"/>
<circle cx="830" cy="339" r="11" fill="#232F3E" stroke="#FFFFFF" stroke-width="2"/><text x="830" y="343.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">5</text>
<text x="830" y="366" text-anchor="middle" font-size="12" font-weight="500" fill="#16191F" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">outcome</text>
<path d="M 655 190 L 655 214" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#head)"/>
<text x="667" y="207" text-anchor="start" font-size="12" font-weight="700" fill="#C7254E" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">stop</text>
<rect x="24" y="668" width="1232" height="180" rx="6" fill="#F7F8FA" stroke="#D5DBDB"/>
<text x="44" y="696" font-size="14" font-weight="700" fill="#16191F">One action</text>
<circle cx="54" cy="717.5" r="9" fill="#232F3E"/><text x="54" y="722" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">1</text>
<text x="74" y="722" font-size="13" fill="#16191F">An agent asks the gate to act.</text>
<circle cx="54" cy="740.5" r="9" fill="#232F3E"/><text x="54" y="745" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">2</text>
<text x="74" y="745" font-size="13" fill="#16191F">One transaction: counter, permission check, the action and its audit entry.</text>
<circle cx="54" cy="763.5" r="9" fill="#232F3E"/><text x="54" y="768" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">3</text>
<text x="74" y="768" font-size="13" fill="#16191F">The worker asks the sender to claim the action, then send it.</text>
<circle cx="54" cy="786.5" r="9" fill="#232F3E"/><text x="54" y="791" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">4</text>
<text x="74" y="791" font-size="13" fill="#16191F">The target applies it once, keyed by action id, and returns evidence.</text>
<circle cx="54" cy="809.5" r="9" fill="#232F3E"/><text x="54" y="814" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">5</text>
<text x="74" y="814" font-size="13" fill="#16191F">The outcome is recorded with that evidence.</text>
<line x1="640" y1="684" x2="640" y2="832" stroke="#D5DBDB"/>
<text x="664" y="696" font-size="14" font-weight="700" fill="#16191F">A stop</text>
<circle cx="674" cy="717.5" r="9" fill="#C7254E"/><text x="674" y="722" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">a</text>
<text x="694" y="722" font-size="13" fill="#16191F">One transaction revokes the permission and everything below it,</text>
<text x="694" y="745" font-size="13" fill="#16191F">cancels what was allowed but not claimed, and writes the receipt.</text>
<circle cx="674" cy="763.5" r="9" fill="#C7254E"/><text x="674" y="768" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">b</text>
<text x="694" y="768" font-size="13" fill="#16191F">The sender asks each target about claimed work with no answer.</text>
<text x="694" y="791" font-size="13" fill="#16191F">What never arrived is fenced there. An unreachable target stays unknown.</text>
<circle cx="674" cy="809.5" r="9" fill="#C7254E"/><text x="674" y="814" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">c</text>
<text x="694" y="814" font-size="13" fill="#16191F">The receipt closes only on evidence. Waiting never closes it.</text>
</svg>
