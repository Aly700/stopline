<text x="366" y="262.0" font-size="12" fill="#545B64">the check, the stop, receipts, undo</text>
<rect x="320" y="306" width="440" height="66" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
<rect x="330" y="326.0" width="26" height="26" rx="4" fill="#3B48CC"/>
<text x="343" y="343.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">&#8594;</text>
<text x="366" y="336.0" font-size="14" font-weight="700" fill="#16191F">Sender</text>
<text x="366" y="354.0" font-size="12" fill="#545B64">the only code that calls a target: claim, send, look up, fence</text>
<rect x="64" y="476" width="112" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
<text x="78" y="501.0" font-size="14" font-weight="700" fill="#16191F">Repair</text>
<text x="78" y="519.0" font-size="12" fill="#545B64">agent</text>
<rect x="188" y="476" width="112" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
<text x="202" y="501.0" font-size="14" font-weight="700" fill="#16191F">Worker</text>
<text x="202" y="519.0" font-size="12" fill="#545B64">one</text>
<rect x="312" y="476" width="112" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
<text x="326" y="501.0" font-size="14" font-weight="700" fill="#16191F">Worker</text>
<text x="326" y="519.0" font-size="12" fill="#545B64">two</text>
<rect x="64" y="548" width="360" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
<rect x="74" y="563.0" width="26" height="26" rx="4" fill="#8C4FFF"/>
<text x="87" y="580.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">A</text>
<text x="110" y="573.0" font-size="14" font-weight="700" fill="#16191F">Live agent</text>
<text x="110" y="591.0" font-size="12" fill="#545B64">Deep Agents: plans and delegates on its own</text>
<rect x="484" y="476" width="276" height="60" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
<rect x="494" y="493.0" width="26" height="26" rx="4" fill="#D86613"/>
<text x="507" y="510.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">K</text>
<text x="530" y="503.0" font-size="14" font-weight="700" fill="#16191F">Kubernetes cluster (kind)</text>
<text x="530" y="521.0" font-size="12" fill="#545B64">two Deployments: api and worker</text>
<rect x="484" y="548" width="276" height="60" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
<rect x="494" y="565.0" width="26" height="26" rx="4" fill="#D86613"/>
<text x="507" y="582.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">R</text>
<text x="530" y="575.0" font-size="14" font-weight="700" fill="#16191F">Traffic router</text>
<text x="530" y="593.0" font-size="12" fill="#545B64">own process, own SQLite log</text>
<rect x="900" y="96" width="336" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
<rect x="910" y="111.0" width="26" height="26" rx="4" fill="#00684A"/>
<text x="923" y="128.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">DB</text>
<text x="946" y="121.0" font-size="14" font-weight="700" fill="#16191F">permissions</text>
<text x="946" y="139.0" font-size="12" fill="#545B64">who may do what; one shared counter</text>
<rect x="900" y="164" width="336" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
<rect x="910" y="179.0" width="26" height="26" rx="4" fill="#00684A"/>
<text x="923" y="196.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">DB</text>
<text x="946" y="189.0" font-size="14" font-weight="700" fill="#16191F">actions</text>
<text x="946" y="207.0" font-size="12" fill="#545B64">admitted, sent, then a final state</text>
<rect x="900" y="232" width="336" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
<rect x="910" y="247.0" width="26" height="26" rx="4" fill="#00684A"/>
<text x="923" y="264.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">DB</text>
<text x="946" y="257.0" font-size="14" font-weight="700" fill="#16191F">audit</text>
<text x="946" y="275.0" font-size="12" fill="#545B64">validated; one decision per counter value</text>
<rect x="900" y="300" width="336" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
<rect x="910" y="315.0" width="26" height="26" rx="4" fill="#00684A"/>
<text x="923" y="332.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">DB</text>
<text x="946" y="325.0" font-size="14" font-weight="700" fill="#16191F">receipts</text>
<text x="946" y="343.0" font-size="12" fill="#545B64">a fixed list; closes only on evidence</text>
<rect x="900" y="372" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
<rect x="910" y="387.0" width="26" height="26" rx="4" fill="#00684A"/>
<text x="923" y="404.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">~</text>
<text x="946" y="397.0" font-size="14" font-weight="700" fill="#16191F">Change</text>
<text x="946" y="415.0" font-size="12" fill="#545B64">streams</text>
<rect x="1076" y="372" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
<rect x="1086" y="387.0" width="26" height="26" rx="4" fill="#00684A"/>
<text x="1099" y="404.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">V</text>
<text x="1122" y="397.0" font-size="14" font-weight="700" fill="#16191F">Vector</text>
<text x="1122" y="415.0" font-size="12" fill="#545B64">Search</text>
<text x="900" y="526" font-size="13" font-weight="700" fill="#16191F">Gemini</text>
<text x="988" y="526" font-size="12" fill="#545B64">plans the repair; the live agent's model</text>
<text x="900" y="556" font-size="13" font-weight="700" fill="#16191F">LangSmith</text>
<text x="988" y="556" font-size="12" fill="#545B64">the live agent's trace</text>
<text x="900" y="586" font-size="13" font-weight="700" fill="#16191F">Voyage AI</text>
<text x="988" y="586" font-size="12" fill="#545B64">embeddings for asking the audit</text>
<text x="900" y="616" font-size="13" font-weight="700" fill="#16191F">ElevenLabs</text>
<text x="988" y="616" font-size="12" fill="#545B64">speaks the receipt</text>
